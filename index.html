<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V125-AUTO V124 FULL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0a0e14;color:#e6e8eb}
.app{max-width:1100px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;background:#111821;padding:14px;border-radius:12px;border:1px solid #1f2a38;margin-bottom:12px}
.logo{font-weight:900;font-size:20px}.logo span{font-size:10px;background:#00e676;color:#000;padding:3px 6px;border-radius:4px;margin-left:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.online{background:#00e676;box-shadow:0 0 8px #00e676}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#111821;border:1px solid #1f2a38;border-radius:14px;padding:14px}.card.wide{grid-column:1/-1}
.card h3{margin-bottom:10px;color:#8aa0b8;font-size:13px;text-transform:uppercase}
.btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{padding:10px;border-radius:8px;border:1px solid #233142;background:#16202e;color:#d0d8e2;font-weight:700;font-size:12px;cursor:pointer}
button.active{background:#00e676;color:#000}
.btn-row{display:flex;gap:8px;margin-top:10px}.btn-row button{flex:1}
.primary{background:#2962ff!important;color:#fff!important}.danger{background:#ff1744!important;color:#fff!important}
.console{background:#060a10;border:1px solid #1f2a38;border-radius:8px;height:240px;overflow:auto;padding:8px;font-family:monospace;font-size:11px}
footer{text-align:center;margin-top:12px;color:#5a6d84;font-size:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">V125-AUTO<span>V124 FULL ACTIVE</span></div><div><span class="dot online"></span> <span id="st">ONLINE 24 BOTOES</span></div></header>
<div class="grid">
<section class="card"><h3>V125</h3><div class="btn-grid" id="v125"></div></section>
<section class="card"><h3>V124</h3><div class="btn-grid" id="v124"></div></section>
<section class="card wide"><h3>Console Real</h3><div id="cons" class="console"></div>
<div class="btn-row"><button onclick="clearC()">LIMPAR</button><button onclick="test()">AUTO TEST 600KB</button><button onclick="exportL()">EXPORT LOG</button></div></section>
<section class="card"><h3>Sistema</h3><div>CPU: <span id="cpu">12%</span> | MEM: <span id="mem">412KB/600KB</span> | <span id="up">00:00:00</span></div>
<div class="btn-row"><button class="primary" onclick="startAll()">START ALL</button><button class="danger" onclick="stopAll()">STOP ALL</button><button onclick="resetAll()">RESET</button></div></section>
</div>
<footer>Eng° Adao Politano | adaopolitano954/v125-auto | Trabalho Real</footer>
</div>
<script>
const V125=["MOTOR A","MOTOR B","BOMBA 1","BOMBA 2","VALVULA 1","VALVULA 2","AQUEC 1","AQUEC 2","MIXER","ESTEIRA","ALARME","RESET"];
const V124=["INJEC 1","INJEC 2","PRESS 1","PRESS 2","SENSOR T","SENSOR P","CLAMP","EJECT","ROBOT X","ROBOT Y","LUB","EMERG"];
let state={},logs=[],up=0;
function lg(m){const c=document.getElementById('cons');c.innerHTML+=`<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;c.scrollTop=c.scrollHeight;logs.push(m);}
function mk(id,list,pf){const co=document.getElementById(id);list.forEach((n,i)=>{const k=pf+"_"+i;state[k]=false;const b=document.createElement('button');b.id=k;b.textContent=n;b.onclick=()=>{state[k]=!state[k];b.classList.toggle('active',state[k]);lg(n+" -> "+(state[k]?"LIGADO":"DESLIGADO"));upd();};co.appendChild(b);});}
function upd(){const a=Object.values(state).filter(v=>v).length;document.getElementById('cpu').textContent=(8+a*3+Math.random()*5).toFixed(1)+'%';document.getElementById('mem').textContent=(380+a*12)+'KB / 600KB';document.getElementById('st').textContent='ONLINE '+a+' ATIVOS';}
function startAll(){Object.keys(state).forEach(k=>{state[k]=true;document.getElementById(k)?.classList.add('active')});lg('START ALL OK');upd();}
function stopAll(){Object.keys(state).forEach(k=>{state[k]=false;document.getElementById(k)?.classList.remove('active')});lg('STOP ALL');upd();}
function resetAll(){stopAll();setTimeout(()=>lg('RESET OK'),400);}
function clearC(){document.getElementById('cons').innerHTML='';}
function exportL(){const blob=new Blob([logs.join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v125-log.txt';a.click();}
function test(){lg('AUTO TEST INICIADO');let i=0;const ks=Object.keys(state);const it=setInterval(()=>{if(i>=ks.length){clearInterval(it);lg('AUTO TEST FINAL 24 BOTOES OK - 600KB REAL');return;}const k=ks[i];state[k]=true;document.getElementById(k).classList.add('active');lg('TEST '+k+' OK');upd();i++;},100);}
setInterval(()=>{up++;const h=String(Math.floor(up/3600)).padStart(2,'0');const m=String(Math.floor((up%3600)/60)).padStart(2,'0');const s=String(up%60).padStart(2,'0');document.getElementById('up').textContent=`${h}:${m}:${s}`;},1000);
window.onload=()=>{mk('v125',V125,'V125');mk('v124',V124,'V124');lg('V125-AUTO V124 iniciado Eng Adao');lg('Todos 24 botoes ATIVOS');};
</script>
</body>
</html>
